name: myscoutee-ci
services:
  gitlab:
    image: ${GITLAB_IMAGE:?Run scripts/lab.sh init first}
    hostname: gitlab
    labels:
      io.myscoutee.lab.group: ${GITLAB_GROUP:-myscoutee}
      io.myscoutee.lab.project: ${GITLAB_PROJECT:-ci}
    restart: "no"
    shm_size: 256m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:${GITLAB_HTTP_PORT:-8929}'
        registry_external_url 'http://localhost:${GITLAB_REGISTRY_PORT:-5050}'
        registry_nginx['listen_port'] = ${GITLAB_REGISTRY_PORT:-5050}
        registry_nginx['listen_https'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2224}
        gitlab_rails['initial_root_password'] = File.read('/run/secrets/root_password').strip
        gitlab_rails['gitlab_signup_enabled'] = false
        letsencrypt['enable'] = false
        prometheus_monitoring['enable'] = false
        puma['worker_processes'] = ${GITLAB_PUMA_WORKERS:-2}
        sidekiq['concurrency'] = ${GITLAB_SIDEKIQ_CONCURRENCY:-5}
    ports:
      - "127.0.0.1:${GITLAB_HTTP_PORT:-8929}:${GITLAB_HTTP_PORT:-8929}"
      - "127.0.0.1:${GITLAB_SSH_PORT:-2224}:22"
      - "127.0.0.1:${GITLAB_REGISTRY_PORT:-5050}:${GITLAB_REGISTRY_PORT:-5050}"
    volumes:
      - ${LAB_STATE_DIR:?Set external state directory}/gitlab/config:/etc/gitlab
      - ${LAB_STATE_DIR}/gitlab/logs:/var/log/gitlab
      - ${LAB_STATE_DIR}/gitlab/data:/var/opt/gitlab
    secrets:
      - root_password
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck", "--fail", "--max-time", "10"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 10m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  runner:
    image: ${RUNNER_IMAGE:?Run scripts/lab.sh init first}
    restart: "no"
    profiles: [runner]
    volumes:
      - ${LAB_STATE_DIR}/runner:/etc/gitlab-runner
      # Only the runner manager gets the socket; validation jobs do not.
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  default:
    name: myscoutee-ci
secrets:
  root_password:
    file: ${LAB_STATE_DIR}/root-password
